# ─── Snezhok coturn TURN Server Configuration ────────────────────────────────
#
# This enables WebRTC voice calls to work across NATs and firewalls.
# Only needed when friends connect from different networks (not on the same LAN).
#
# To enable: uncomment the coturn service in docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────

# Listening port
listening-port=3478

# TLS listening port (optional, for TURNS)
# tls-listening-port=5349

# Use fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Static user credentials (fine for private use with ≤10 users)
user=cozyuser:cozypassword

# Realm (can be anything for private use)
realm=snezhok.local

# Total quota of per-session allocations
total-quota=100

# Max bytes-per-second bandwidth
max-bps=0

# Stale nonce lifetime
stale-nonce=600

# Logging
log-file=stdout
verbose

# Disable CLI
no-cli

# Disable multicast peers
no-multicast-peers

# Relay IP (set to your server's public/LAN IP)
# relay-ip=YOUR_SERVER_IP
# external-ip=YOUR_PUBLIC_IP/YOUR_PRIVATE_IP
