name: Snezhok platform CI

on:
  pull_request:
    paths:
      - "platform/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "platform/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/platform-ci.yml"

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: platform

jobs:
  quality:
    name: Types, tests, builds and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Verify dependency licenses and committed-secret hygiene
        run: npm run compliance:check
      - name: Scan complete Git history for leaked credentials
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --config config/gitleaks.toml --log-opts=--all ..
      - name: Generate all-dependency license inventory and CycloneDX SBOM
        run: >-
          npm run compliance:artifacts --
          --revision "${{ github.sha }}"
          --output-directory build/compliance/all
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snezhok-supply-chain-${{ github.sha }}
          path: platform/build/compliance/all/
          if-no-files-found: error
          retention-days: 30
      - run: npm ci
      - name: Audit deployable production workspace dependencies
        run: |
          npm audit --omit=dev --workspace=@snezhok/api --audit-level=high
          npm audit --omit=dev --workspace=@snezhok/media-worker --audit-level=high
          npm audit --omit=dev --workspace=@snezhok/web --audit-level=high
          npm audit --omit=dev --workspace=@snezhok/contracts --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run release:verify-config
      - run: npm run doctor --workspace=@snezhok/mobile
      - name: Validate host scripts and deployment composition
        env:
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ci-not-a-production-secret
          API_DATABASE_PASSWORD: ci-api-database-password-long-enough
          WORKER_DATABASE_PASSWORD: ci-worker-database-password-long-enough
          JWT_SECRET: ci-only-value-that-is-at-least-32-random-bytes
          LIVEKIT_API_KEY: ci-livekit-key
          LIVEKIT_API_SECRET: ci-livekit-secret-value-long-enough
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          find scripts apps/postgres -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
          python3 -m py_compile scripts/livekit/connectivity-smoke.py
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint ../.github/workflows/platform-ci.yml
          systemd-analyze verify infra/systemd/*.service infra/systemd/*.timer
          cp .env.example .env
          docker compose --file docker-compose.production.yml config --quiet
          docker compose --file docker-compose.production.yml build app media-worker postgres livekit
          bash scripts/deploy/verify-production-images.sh "${{ github.sha }}"
          bash scripts/ci/verify-database-roles.sh
          rm .env

  release-apk:
    name: Production-like Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-4000-8000-000000000001
      GOOGLE_SERVICES_JSON: /tmp/snezhok-ci-google-services.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Install production dependencies only
        run: npm ci --omit=dev
      - name: Prove development native modules are absent
        run: |
          test ! -e node_modules/expo-dev-client
          test ! -e node_modules/expo-dev-launcher
          test ! -e node_modules/expo-dev-menu
          node scripts/android/verify-release-config.mjs
      - name: Generate ephemeral CI release signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/snezhok-ci-release.jks" \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias snezhok-ci \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=Snezhok CI,OU=CI,O=Snezhok,C=RU"
      - name: Generate package-matching CI Firebase fixture
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const document = {
            project_info: {
              project_number: "123456789012",
              project_id: "snezhok-ci",
              storage_bucket: "snezhok-ci.invalid",
            },
            client: [{
              client_info: {
                mobilesdk_app_id: "1:123456789012:android:0000000000000000000000",
                android_client_info: { package_name: "xyz.merchedits.snezhok" },
              },
              oauth_client: [],
              api_key: [{ current_key: "ci-not-a-real-api-key" }],
              services: { appinvite_service: { other_platform_oauth_client: [] } },
            }],
            configuration_version: "1",
          };
          fs.writeFileSync(process.env.GOOGLE_SERVICES_JSON, JSON.stringify(document));
          NODE
      - name: Enforce signing, push and source release inputs
        env:
          SNEZHOK_RELEASE_BUILD: "1"
          SNEZHOK_KEYSTORE_FILE: ${{ runner.temp }}/snezhok-ci-release.jks
          SNEZHOK_KEYSTORE_PASSWORD: ci-release-password
          SNEZHOK_KEY_ALIAS: snezhok-ci
          SNEZHOK_KEY_PASSWORD: ci-release-password
          SNEZHOK_SOURCE_REVISION: ${{ github.sha }}
        run: npm run release:verify-production-env
      - name: Generate native project
        env:
          SNEZHOK_RELEASE_BUILD: "1"
          SNEZHOK_KEYSTORE_FILE: ${{ runner.temp }}/snezhok-ci-release.jks
          SNEZHOK_KEYSTORE_PASSWORD: ci-release-password
          SNEZHOK_KEY_ALIAS: snezhok-ci
          SNEZHOK_KEY_PASSWORD: ci-release-password
          SNEZHOK_SOURCE_REVISION: ${{ github.sha }}
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: platform/apps/mobile
      - name: Run native transfer tests and compile performance harness
        env:
          SNEZHOK_RELEASE_BUILD: "1"
          SNEZHOK_KEYSTORE_FILE: ${{ runner.temp }}/snezhok-ci-release.jks
          SNEZHOK_KEYSTORE_PASSWORD: ci-release-password
          SNEZHOK_KEY_ALIAS: snezhok-ci
          SNEZHOK_KEY_PASSWORD: ci-release-password
          SNEZHOK_SOURCE_REVISION: ${{ github.sha }}
        run: >-
          ./gradlew --no-daemon
          :snezhok-background-transfer:testDebugUnitTest
          :macrobenchmark:assembleBenchmark
        working-directory: platform/apps/mobile/android
      - name: Assemble minimized release APK
        env:
          SNEZHOK_RELEASE_BUILD: "1"
          SNEZHOK_KEYSTORE_FILE: ${{ runner.temp }}/snezhok-ci-release.jks
          SNEZHOK_KEYSTORE_PASSWORD: ci-release-password
          SNEZHOK_KEY_ALIAS: snezhok-ci
          SNEZHOK_KEY_PASSWORD: ci-release-password
          SNEZHOK_SOURCE_REVISION: ${{ github.sha }}
        run: ./gradlew --no-daemon :app:assembleRelease
        working-directory: platform/apps/mobile/android
      - name: Verify resolved Android runtime dependency evidence
        run: >-
          npm run compliance:verify-android --
          --directory apps/mobile/android/app/src/main/assets/legal/android
          --revision "${{ github.sha }}"
      - name: Reject development launchers and unexpected ABIs
        run: >-
          node scripts/android/verify-release-artifact.mjs
          --apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          --package xyz.merchedits.snezhok
          --architectures arm64-v8a,armeabi-v7a
      - name: Generate production dependency inventory and CycloneDX SBOM
        run: >-
          npm run compliance:artifacts --
          --omit-dev
          --revision "${{ github.sha }}"
          --output-directory build/compliance/release
      - name: Prove the corresponding source revision is public
        if: github.event_name == 'push'
        run: >-
          npm run release:verify-source --
          --revision "${{ github.sha }}"
          --repository https://github.com/merchedits/snezhok
      - name: Upload inspected APK and release supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snezhok-android-ci-${{ github.sha }}
          path: |
            platform/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            platform/build/compliance/release/dependency-licenses.json
            platform/build/compliance/release/snezhok.cdx.json
            platform/apps/mobile/android/app/src/main/assets/legal/android/android-dependencies.json
            platform/apps/mobile/android/app/src/main/assets/legal/android/snezhok-android.cdx.json
            platform/apps/mobile/android/app/src/main/assets/legal/android/ANDROID_THIRD_PARTY_NOTICES.txt
            platform/apps/mobile/android/app/src/main/assets/legal/android/texts/
          if-no-files-found: error
          retention-days: 14

  container-security:
    name: Container vulnerability gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare container evidence directory
        run: mkdir -p build/compliance/containers
      - name: Build API image from reviewed source
        run: docker build --tag snezhok-api:${{ github.sha }} --file Dockerfile .
      - name: Generate API container CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, immutable release
        with:
          image-ref: snezhok-api:${{ github.sha }}
          format: cyclonedx
          output: platform/build/compliance/containers/snezhok-api.cdx.json
          scanners: vuln
      - name: Reject fixable high and critical API image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, immutable release
        with:
          image-ref: snezhok-api:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build media-worker image from reviewed source
        run: docker build --tag snezhok-media-worker:${{ github.sha }} --file apps/media-worker/Dockerfile .
      - name: Generate media-worker container CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, immutable release
        with:
          image-ref: snezhok-media-worker:${{ github.sha }}
          format: cyclonedx
          output: platform/build/compliance/containers/snezhok-media-worker.cdx.json
          scanners: vuln
      - name: Reject fixable high and critical media-worker image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, immutable release
        with:
          image-ref: snezhok-media-worker:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build PostgreSQL archive image from reviewed source
        run: docker build --tag snezhok-postgres:${{ github.sha }} --file apps/postgres/Dockerfile .
      - name: Generate PostgreSQL archive image CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, immutable release
        with:
          image-ref: snezhok-postgres:${{ github.sha }}
          format: cyclonedx
          output: platform/build/compliance/containers/snezhok-postgres.cdx.json
          scanners: vuln
      - name: Reject fixable high and critical PostgreSQL image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, immutable release
        with:
          image-ref: snezhok-postgres:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build LiveKit from reviewed upstream source
        run: >-
          docker build
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --tag snezhok-livekit:${{ github.sha }}
          --file apps/livekit/Dockerfile .
      - name: Generate LiveKit container CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, immutable release
        with:
          image-ref: snezhok-livekit:${{ github.sha }}
          format: cyclonedx
          output: platform/build/compliance/containers/livekit.cdx.json
          scanners: vuln
      - name: Reject fixable high and critical LiveKit image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0, immutable release
        with:
          image-ref: snezhok-livekit:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload container SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snezhok-container-sboms-${{ github.sha }}
          path: platform/build/compliance/containers/
          if-no-files-found: error
          retention-days: 30
