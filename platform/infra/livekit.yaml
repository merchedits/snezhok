port: 7880
log_level: info

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  # The host sits behind NAT. Do not pin private LAN candidates here: mobile
  # peers outside 192.168.2.0/24 cannot reach them. LiveKit discovers and
  # advertises the router's public address through STUN when use_external_ip
  # is enabled; the router must forward the documented RTC and TURN ports.
  advertise_internal_ip: false
  skip_external_ip_validation: true
  use_ice_lite: false

turn:
  enabled: true
  udp_port: 3478
  # The privately-operated installation currently serves two active testers.
  # Keep the relay pool deliberately small so routers without range-forwarding
  # support can expose each port explicitly and audibly.
  relay_range_start: 40000
  relay_range_end: 40007
  # LiveKit 1.12+ blocks relays to private peers unless explicitly allowed.
  # The SFU is on this private subnet because the server is behind the router.
  allow_restricted_peer_cidrs:
    - 192.168.2.0/24

room:
  empty_timeout: 300
  departure_timeout: 20
  # Rooms are created only by the authenticated API control client. A stale
  # participant token therefore cannot recreate a room after moderation ends it.
  auto_create: false
  enabled_codecs:
    - mime: audio/opus
    - mime: video/VP8
    - mime: video/H264

# The signing key is injected as LIVEKIT_WEBHOOK_API_KEY so it never enters
# source control. LiveKit runs on the host network and reaches the API through
# its loopback-only published port.
webhook:
  urls:
    - http://127.0.0.1:3003/api/v1/livekit/webhook

audio:
  active_level: 30
  min_percentile: 40
  update_interval: 500
  smooth_intervals: 4
  active_red_encoding: true

logging:
  level: info
  pion_level: warn
  json: true
  sample: false
