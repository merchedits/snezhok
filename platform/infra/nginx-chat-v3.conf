# Add these locations before the existing /chat/ location. The application
# remains mounted at /chat/; LiveKit signaling is proxied separately while its
# encrypted media travels over the dedicated RTC ports.

location ^~ /chat/livekit/ {
    proxy_pass http://127.0.0.1:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
}

location ^~ /chat/_media/ {
    internal;
    alias /home/merchedits/sites/snezhok-v3/platform/data-v3/storage/objects/;
    add_header Cache-Control "private, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Stream resumable chunks and legacy whole-file uploads directly to the API.
# Disabling request buffering prevents nginx from copying multi-gigabyte bodies
# to its temporary filesystem before the application can persist or cancel them.
location ^~ /chat/api/v1/uploads/ {
    proxy_pass http://127.0.0.1:3003/api/v1/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    client_max_body_size 2g;
}

# During a staged release this points to 127.0.0.1:3003. Switching this one
# upstream line cuts traffic over to v3 without changing the public URL.
location /chat/ {
    proxy_pass http://127.0.0.1:3003/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    client_max_body_size 2g;
}
