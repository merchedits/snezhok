# TURN/TLS backend for a public turn.merchedits.xyz:443 layer-4 endpoint. The
# LiveKit server listens on 5349, but clients are always told to use public port
# 443. Do not activate this file until the SNI router and trusted TURN
# certificate described in docs/CALL_CONNECTIVITY.md are in place.
port: 7880
log_level: info

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  ips:
    includes:
      - 192.168.2.0/24
  advertise_internal_ip: true
  skip_external_ip_validation: true
  use_ice_lite: false
  allow_tcp_fallback: true

turn:
  enabled: true
  udp_port: 3478
  tls_port: 5349
  domain: turn.merchedits.xyz
  cert_file: /etc/livekit/tls/fullchain.pem
  key_file: /etc/livekit/tls/privkey.pem
  relay_range_start: 40000
  relay_range_end: 40007
  ttl_seconds: 300
  allow_restricted_peer_cidrs:
    - 192.168.2.0/24

room:
  empty_timeout: 300
  departure_timeout: 20
  auto_create: false
  enabled_codecs:
    - mime: audio/opus
    - mime: video/VP8
    - mime: video/H264

webhook:
  urls:
    - http://127.0.0.1:3003/api/v1/livekit/webhook

audio:
  active_level: 30
  min_percentile: 40
  update_interval: 500
  smooth_intervals: 4
  active_red_encoding: true

logging:
  level: info
  pion_level: warn
  json: true
  sample: false
